# ── Local development only (not used in EKS) ─────────────────────────────────
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Live sync — code changes reflect immediately via --reload
      - ./backend/app:/app/app
      - ./backend/config:/app/config
    env_file:
      - .env
    # Override production CMD with --reload for hot reloading
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
