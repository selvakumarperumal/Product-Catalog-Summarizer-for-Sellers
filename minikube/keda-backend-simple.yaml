# =============================================================================
# Product Catalog Summarizer Backend - Kubernetes, KEDA & Gateway API Manifest
# =============================================================================

# -----------------------------------------------------------------------------
# 1. DEPLOYMENT
# -----------------------------------------------------------------------------
# Purpose: Defines the desired state for the backend application workload.
# Note on Replicas: The `replicas` field is intentionally omitted here so that
# KEDA's ScaledObject has sole authority over pod scaling, avoiding conflicts
# during `kubectl apply`.
# Container Port: Port 8000 is used internally where FastAPI/Uvicorn runs.
# Environment: Secrets are dynamically mounted from `my-secret` via `envFrom`.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-summarizer-backend
  namespace: default
  labels:
    app: catalog-summarizer-backend
spec:
  selector:
    matchLabels:
      app: catalog-summarizer-backend
  template:
    metadata:
      labels:
        app: catalog-summarizer-backend
    spec:
      containers:
      - name: backend
        image: docker.io/library/pcs-app:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - secretRef:
            name: my-secret
        env:
        - name: TF_MODEL_NAME
          value: "gemini-2.0-flash"
        - name: TF_MODEL_TEMPERATURE
          value: "0.3"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
# -----------------------------------------------------------------------------
# 2. SERVICE
# -----------------------------------------------------------------------------
# Purpose: Exposes the backend Deployment internally within the cluster.
# Port Mapping: Exposes standard HTTP port 80 to cluster clients and routes
# traffic to container targetPort 8000.
# Istio Integration: The port is named `http` so Istio Envoy sidecars automatically
# enable HTTP L7 protocol processing, tracing, and metrics.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: catalog-summarizer-backend-svc
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: catalog-summarizer-backend
---
# -----------------------------------------------------------------------------
# 3. KEDA SCALEDOBJECT
# -----------------------------------------------------------------------------
# Purpose: Configures event-driven and metric-based autoscaling for the backend.
# Scaling Boundaries: Maintains between 1 (minimum) and 3 (maximum) replicas.
# Triggers:
#   - CPU: Scales up when average CPU utilization exceeds 70%.
#   - Memory: Scales up when average Memory utilization exceeds 75%.
#   - Cron: Pre-scales to 3 replicas during weekday business hours (9 AM - 8 PM IST).
# -----------------------------------------------------------------------------
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: catalog-summarizer-scaler
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalog-summarizer-backend
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 15
  cooldownPeriod: 60
  triggers:
  - type: cpu
    metricType: Utilization
    metadata:
      value: "70"
  - type: memory
    metricType: Utilization
    metadata:
      value: "75"
  - type: cron
    metadata:
      timezone: Asia/Kolkata
      start: "0 9 * * 1-5"
      end: "0 20 * * 1-5"
      desiredReplicas: "3"
---
# -----------------------------------------------------------------------------
# 4. GATEWAYCLASS (KUBERNETES GATEWAY API)
# -----------------------------------------------------------------------------
# Purpose: Defines the controller class for managing Gateway instances.
# Controller Link: Binds `gatewayClassName: istio` to Istio's Gateway API
# controller (`istio.io/gateway-controller`).
# -----------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: istio
spec:
  controllerName: istio.io/gateway-controller
---
# -----------------------------------------------------------------------------
# 5. GATEWAY (KUBERNETES GATEWAY API)
# -----------------------------------------------------------------------------
# Purpose: Defines the entrypoint load balancer receiving external HTTP traffic.
# Listener: Listens on port 80 for HTTP connections matching `gatewayClassName: istio`.
# -----------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: catalog-summarizer-gateway
  namespace: default
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
# -----------------------------------------------------------------------------
# 6. HTTPROUTE (KUBERNETES GATEWAY API)
# -----------------------------------------------------------------------------
# Purpose: Defines Layer-7 routing rules for HTTP traffic entering the Gateway.
# Routing Rule: Binds to `catalog-summarizer-gateway` and routes all requests with
# path prefix `/` to `catalog-summarizer-backend-svc` on port 80.
# -----------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog-summarizer-httproute
  namespace: default
spec:
  parentRefs:
  - name: catalog-summarizer-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: catalog-summarizer-backend-svc
      port: 80
