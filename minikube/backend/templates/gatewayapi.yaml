{{- if .Values.gatewayApi.enabled -}}
{{- $gwName := default (printf "%s-gateway" (include "backend.fullname" .)) .Values.gatewayApi.gateway.name -}}
{{- if .Values.gatewayApi.gatewayClass.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayApi.gatewayClass.name | default "istio" }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  controllerName: {{ .Values.gatewayApi.gatewayClass.controllerName | default "istio.io/gateway-controller" }}
---
{{- end }}
{{- if .Values.gatewayApi.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gwName }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gatewayApi.gateway.className | default "istio" }}
  listeners:
  - name: http
    port: {{ .Values.gatewayApi.gateway.port | default 80 }}
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "backend.fullname" . }}-httproute
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ $gwName }}
  {{- if .Values.gatewayApi.hostnames }}
  hostnames:
  {{- range .Values.gatewayApi.hostnames }}
  - {{ . | quote }}
  {{- end }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.gatewayApi.pathPrefix | default "/" | quote }}
    backendRefs:
    - name: {{ include "backend.fullname" . }}
      port: {{ .Values.service.port }}
{{- end }}
